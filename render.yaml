services:
  - type: web
    name: siash-utin-cloud
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: siash-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PGSSLMODE
        value: disable
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.2

databases:
  - name: siash-postgres
    plan: free
