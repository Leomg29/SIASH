name: SIASH v0.14.41 correction proposal baseline
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01441-correction-proposal-baseline]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check app.js
      - run: node tests/correction-proposal-baseline.test.js
