name: SIASH v01418 final Word sanitization
on:
  push:
    branches: [fix/v0.14.18-final-word-sanitization]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix/v0.14.18-final-word-sanitization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 scripts/patch_v01418.py
      - run: node --check app.js
      - run: node --check server.js
      - run: node -e "const p=require('./package.json'); if(p.version!=='0.14.18') process.exit(1)"
      - run: |
          git config user.name Leomg29
          git config user.email leomg29@yahoo.com.br
          git add app.js server.js index.html package.json
          git commit -m 'SIASH v0.14.18 sanitize final published Word' || exit 0
          git push origin HEAD:fix/v0.14.18-final-word-sanitization

