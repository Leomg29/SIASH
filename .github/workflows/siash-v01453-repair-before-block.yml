name: SIASH v0.14.53 repair before block
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01453-repair-before-block]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node tests/repair-before-block.test.js
