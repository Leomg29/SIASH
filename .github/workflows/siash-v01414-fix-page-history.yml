name: SIASH v0.14.14 - corrigir paginacao no Controle Historico
on:
  push:
    branches: [fix/v0.14.14-confirmar-paginacao]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-and-test:
    if: "!contains(github.event.head_commit.message, 'SIASH v0.14.14: fix final page history detection')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.14.14-confirmar-paginacao
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar correcao fail-closed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text()
          old='''function updatePreparedHistoryPageCountXml(xml,revision,pages){
 const m=xml.match(/<w:tbl(?:\\s[^>]*)?>[\\s\\S]*?Controle Hist[óo]rico[\\s\\S]*?<\\/w:tbl>/i);if(!m)return {ok:false,reason:"history-table-not-found"};const table=m[0],rows=[...table.matchAll(/<w:tr(?:\\s[^>]*)?>[\\s\\S]*?<\\/w:tr>/g)].map(x=>x[0]);'''
          new='''function updatePreparedHistoryPageCountXml(xml,revision,pages){
 // v0.14.14: usa o mesmo detector estrutural robusto da preparacao/publicacao.
 // Word pode fragmentar "Controle Historico" em varios runs; regex textual direta falha nesses casos.
 const hist=historyTableData(xml);if(!hist)return {ok:false,reason:"history-table-not-found"};const table=hist.table,rows=hist.rows||[...table.matchAll(/<w:tr(?:\\s[^>]*)?>[\\s\\S]*?<\\/w:tr>/g)].map(x=>x[0]);'''
          if old not in s: raise SystemExit('BLOQUEADO: assinatura antiga nao encontrada')
          s=s.replace(old,new,1).replace('Alpha Consolidada v0.14.13','Alpha Consolidada v0.14.14').replace('schema:"siash-0.14.13"','schema:"siash-0.14.14"')
          p.write_text(s)
          PY
      - name: Testes de sintaxe e regressao
        run: |
          node --check app.js
          node --check server.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(); start=s.index('function updatePreparedHistoryPageCountXml'); block=s[start:start+1800]
          assert 'historyTableData(xml)' in block
          assert 'xml.match(/<w:tbl' not in block[:500]
          assert 'history-table-not-found' in block
          assert 'Alpha Consolidada v0.14.14' in s
          assert 'schema:"siash-0.14.14"' in s
          print('PASS: detector robusto na paginacao; fail-closed preservado; v0.14.14')
          PY
      - name: Commit da correcao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          git commit -m "SIASH v0.14.14: fix final page history detection"
          git push origin HEAD:fix/v0.14.14-confirmar-paginacao
