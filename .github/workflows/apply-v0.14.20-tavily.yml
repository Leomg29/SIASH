name: Apply SIASH v0.14.20 Tavily integration
on:
  push:
    branches: [feat-v0.14.20-tavily-research]
    paths: ['.github/workflows/apply-v0.14.20-tavily.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-v0.14.20-tavily-research
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Integrate Tavily evidence into AI revision flow
        shell: python
        run: |
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text(encoding='utf-8')
          old='''  const diagnostic=options?.diagnostic===true;\n  console.log(`[SIASH AI] início da revisão | ordem=${order.join(">")}`);\n  for(const p of order){'''
          new='''  const diagnostic=options?.diagnostic===true;\n  let webResearch=null;\n  let revisionPrompt=prompt;\n  if(requireWebResearch&&TAVILY_API_KEY){\n    try{\n      webResearch=await researchWithTavily(prompt);\n      revisionPrompt=[\n        prompt,\n        "",\n        "PESQUISA WEB ATUAL E VERIFICÁVEL FORNECIDA PELO TAVILY:",\n        webResearch.evidence,\n        "",\n        "REGRA DE EVIDÊNCIA: use somente as fontes acima para sustentar afirmações que dependam de pesquisa web atual. Preserve os URLs das fontes utilizadas nas referências. Não invente fontes, títulos, normas, datas ou URLs."\n      ].join("\\n");\n      console.log(`[SIASH AI] Tavily habilitou pesquisa web verificável | fontes=${webResearch.sources.length}`);\n    }catch(e){\n      const msg=String(e?.message||"falha").replace(/\\s+/g," ").slice(0,500);\n      errors.push(`tavily: ${msg}`);\n      console.warn(`[SIASH AI] Tavily indisponível | motivo=${msg}`);\n    }\n  }\n  console.log(`[SIASH AI] início da revisão | ordem=${order.join(">")}`);\n  for(const p of order){'''
          if old not in s: raise SystemExit('anchor 1 not found')
          s=s.replace(old,new,1)
          old='''        const webCapable=(p==="openai"&&!!openaiClient)||(p==="gemini"&&!!GEMINI_API_KEY&&geminiUseSearch());\n        if(!webCapable){errors.push(`${p}: pesquisa web atual indisponível`);console.log(`[SIASH AI] provedor ignorado | provider=${p} | motivo=pesquisa_web_obrigatoria`);continue}'''
          new='''        const webCapable=!!webResearch||(p==="openai"&&!!openaiClient)||(p==="gemini"&&!!GEMINI_API_KEY&&geminiUseSearch());\n        if(!webCapable){errors.push(`${p}: pesquisa web atual indisponível`);console.log(`[SIASH AI] provedor ignorado | provider=${p} | motivo=pesquisa_web_obrigatoria`);continue}'''
          if old not in s: raise SystemExit('anchor 2 not found')
          s=s.replace(old,new,1)
          s=s.replace('if(p==="gemini"&&GEMINI_API_KEY)ai=await reviseWithGemini(prompt);','if(p==="gemini"&&GEMINI_API_KEY)ai=await reviseWithGemini(revisionPrompt);',1)
          s=s.replace('else if(p==="cloudflare"&&cloudflareConfigured())ai=await reviseWithCloudflare(prompt);','else if(p==="cloudflare"&&cloudflareConfigured())ai=await reviseWithCloudflare(revisionPrompt);',1)
          s=s.replace('else if(p==="openai"&&openaiClient)ai=await reviseWithOpenAI(prompt);','else if(p==="openai"&&openaiClient)ai=await reviseWithOpenAI(revisionPrompt);',1)
          old='''      console.log(`[SIASH AI${diagnostic?" TEST":""}] proposta concluída | provider=${ai.provider} | model=${ai.model} | researchMode=${ai.researchMode||"provider_default"}`);\n      return ai;'''
          new='''      if(webResearch){\n        const merged=[...(webResearch.sources||[]),...(Array.isArray(ai.sources)?ai.sources:[])];\n        ai.sources=[...new Map(merged.filter(x=>x&&x.url).map(x=>[String(x.url).trim(),x])).values()];\n        ai.researchMode="tavily_search";\n      }\n      console.log(`[SIASH AI${diagnostic?" TEST":""}] proposta concluída | provider=${ai.provider} | model=${ai.model} | researchMode=${ai.researchMode||"provider_default"}`);\n      return ai;'''
          if old not in s: raise SystemExit('anchor 3 not found')
          s=s.replace(old,new,1)
          old='''  if(requireWebResearch){const err=new Error("Esta revisão exige pesquisa web atual, mas nenhum provedor configurado com pesquisa verificável está disponível. Configure Gemini com Google Search ou OpenAI com web_search; o POP vigente permanece inalterado.");err.code="AI_WEB_RESEARCH_REQUIRED";throw err}'''
          new='''  if(requireWebResearch){const err=new Error("Esta revisão exige pesquisa web atual, mas a pesquisa verificável não ficou disponível. Verifique Tavily, Gemini com Google Search ou OpenAI com web_search; o POP vigente permanece inalterado.");err.code="AI_WEB_RESEARCH_REQUIRED";throw err}'''
          if old not in s: raise SystemExit('anchor 4 not found')
          s=s.replace(old,new,1)
          old='''app.get("/api/ai/status",auth,(req,res)=>res.json({configured:!!(GEMINI_API_KEY||cloudflareConfigured()||openaiClient),defaultProvider:AI_DEFAULT_PROVIDER,providers:availableAIProviders(),privacyNotice:'''
          new='''app.get("/api/ai/status",auth,(req,res)=>res.json({configured:!!(GEMINI_API_KEY||cloudflareConfigured()||openaiClient),webResearch:{tavilyConfigured:!!TAVILY_API_KEY},defaultProvider:AI_DEFAULT_PROVIDER,providers:availableAIProviders(),privacyNotice:'''
          if old not in s: raise SystemExit('anchor 5 not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Syntax check
        run: node --check server.js
      - name: Commit integrated flow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'SIASH v0.14.20 integrate Tavily verified research into AI fallback'
          git push
