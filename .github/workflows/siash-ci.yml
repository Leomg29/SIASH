name: SIASH CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check server.js
          node --check app.js
      - name: Regression suite
        shell: bash
        run: |
          set -uo pipefail
          count=0
          failures=0
          for test_file in tests/*.test.js; do
            [ -e "$test_file" ] || continue
            echo "::group::$test_file"
            if node "$test_file"; then
              echo "PASS: $test_file"
            else
              echo "::error file=$test_file::Regression failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Executed $count regression test files; failures: $failures."
          if [ "$count" -eq 0 ] || [ "$failures" -ne 0 ]; then exit 1; fi
