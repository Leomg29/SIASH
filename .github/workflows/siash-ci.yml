name: SIASH CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check server.js
          node --check app.js
      - name: Regression suite
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/*.test.js; do
            [ -e "$test_file" ] || continue
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Executed $count regression test files."
