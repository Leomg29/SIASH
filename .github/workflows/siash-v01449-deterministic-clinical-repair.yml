name: SIASH v0.14.49 deterministic clinical repair
on:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node tests/deterministic-clinical-repair.test.js

