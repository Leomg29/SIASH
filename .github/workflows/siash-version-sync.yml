name: SIASH visible version sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_siash_version.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize and validate visible SIASH version
        run: python scripts/sync_siash_version.py
      - name: Commit synchronized version
        run: |
          if git diff --quiet -- index.html package.json; then
            echo "Version already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html package.json
          git commit -m "SIASH v0.14.23 — sync login and sidebar version"
          git push
