name: SIASH v0.14.19 DOCX safe finalization
on:
  push:
    branches: [fix/v0.14.19-docx-safe-finalization]
    paths:
      - 'scripts/patch_v01419.py'
      - 'scripts/test_v01419_static.js'
      - '.github/workflows/siash-v01419-docx-safe-finalization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.14.19-docx-safe-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch only when needed
        run: |
          if grep -q 'siash-0.14.19' app.js; then echo 'Patch already applied'; else python3 scripts/patch_v01419.py; fi
      - name: Static JavaScript checks
        run: |
          node --check app.js
          node --check server.js
          node scripts/test_v01419_static.js
      - name: Verify safeguards and version
        run: |
          grep -q 'validateDocxBlobIntegrity' app.js
          grep -q 'checkCRC32:true' app.js
          grep -q 'preFinalizationBackupKey' app.js
          grep -q 'docx-final-validation-failed' app.js
          node -e "const p=require('./package.json'); if(p.version!=='0.14.19') process.exit(1)"
          grep -q 'v0.14.19' index.html
      - name: Commit patched application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js server.js index.html package.json
          git diff --cached --quiet && exit 0
          git commit -m 'SIASH v0.14.19: validate DOCX before publication'
          git push origin HEAD:fix/v0.14.19-docx-safe-finalization
