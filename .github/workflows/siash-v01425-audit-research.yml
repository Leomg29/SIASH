name: SIASH v0.14.25 audit research tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check server.js
      - run: node tests/ai-parser.test.js
      - run: node tests/audit-targeted-research.test.js
      - name: Validate release version
        run: |
          grep -q '"version": "0.14.25"' package.json
          test "$(grep -o 'v0.14.25' index.html | wc -l)" -ge 3