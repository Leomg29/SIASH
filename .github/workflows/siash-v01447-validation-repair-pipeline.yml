name: SIASH v0.14.47 validation repair pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01447-validation-repair-pipeline]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check app.js
      - run: node tests/validation-repair-pipeline.test.js
