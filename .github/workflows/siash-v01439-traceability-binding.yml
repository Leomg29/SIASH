name: SIASH v0.14.39 traceability binding repair
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01439-traceability-binding]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check app.js
      - run: node tests/traceability-binding-repair.test.js
