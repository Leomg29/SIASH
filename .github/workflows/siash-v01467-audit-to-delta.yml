name: SIASH v0.14.67 audit to delta
on:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check server.js
      - run: node --check app.js
      - run: node tests/audit-to-delta.test.js
