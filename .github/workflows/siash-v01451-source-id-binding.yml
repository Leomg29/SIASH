name: SIASH v0.14.51 source ID binding
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01451-source-id-binding]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node tests/source-id-binding.test.js
