name: SIASH v0.14.52 functional clinical repair
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01452-functional-clinical-repair]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node tests/functional-clinical-repair.test.js
