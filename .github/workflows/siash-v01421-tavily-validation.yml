name: SIASH v0.14.21 Tavily final validation

on:
  push:
    branches:
      - fix/v0.14.21-tavily-final-validation
    paths:
      - scripts/patch_v01421.py
      - .github/workflows/siash-v01421-tavily-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.14.21-tavily-final-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded patch
        run: python3 scripts/patch_v01421.py
      - name: JavaScript syntax check
        run: node --check server.js
      - name: Regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text(encoding='utf-8')
          assert '"web_search","google_search","tavily_search"' in s, 'tavily_search missing from final gate'
          assert 'researchMode:"tavily_search"' in s, 'Tavily research mode missing'
          assert 'if(sources.length<2)' in s, 'minimum source safeguard missing'
          assert 'ai.researchMode="tavily_search"' in s, 'research provenance propagation missing'
          assert 'const classified=candidateSources.length?await classifyReferenceUrls(candidateSources)' in s, 'reference URL verification missing'
          print('v0.14.21 regression assertions passed')
          PY
      - name: Commit patched server if needed
        run: |
          if git diff --quiet -- server.js; then
            echo 'server.js already patched; nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Fix v0.14.21 Tavily final research validation'
          git push origin HEAD:fix/v0.14.21-tavily-final-validation
