name: SIASH v01416 DOCX XML integrity repair
on:
  push:
    branches:
      - fix/v0.14.16-docx-xml-integrity
    paths:
      - .github/workflows/siash-v01416-docx-xml-integrity.yml
permissions:
  contents: write
jobs:
  fix_and_test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.14.16-docx-xml-integrity
      - name: Apply DOCX structural repair and regression tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text()
          old='function removeProposalStatusParagraphs(xml){\n let changed=false;const out=String(xml||"").replace(/<w:p(?:\\s[^>]*)?>[\\s\\S]*?<\\/w:p>/g,p=>{const text=xmlPlainText(p);if(/^Proposta\\s+de\\s+Revis[aã]o\\s+\\d{1,3}\\s*[–—-]\\s*vig[eê]ncia\\s+ap[oó]s\\s+valida[cç][aã]o\\s+e\\s+publica[cç][aã]o\\s+institucional\\.?$/i.test(text)){changed=true;return ""}return p});return {xml:out,changed};\n}'
          new='''function ensureWordTableCellParagraphs(xml){\n let changed=false;const out=String(xml||"").replace(/<w:tc(?:\\s[^>]*)?>[\\s\\S]*?<\\/w:tc>/g,tc=>{if(/<w:p(?:\\s|>|\\/)/.test(tc))return tc;changed=true;return tc.replace(/<\\/w:tc>$/,"<w:p/></w:tc>")});return {xml:out,changed};\n}\nfunction removeProposalStatusParagraphs(xml){\n // v0.14.16 — nunca remova fisicamente o único parágrafo de uma célula Word.\n // Um <w:tc> sem <w:p> é XML OpenXML estruturalmente inválido e faz o Word pedir recuperação.\n let changed=false;let out=String(xml||"").replace(/<w:p(?:\\s[^>]*)?>[\\s\\S]*?<\\/w:p>/g,p=>{const text=xmlPlainText(p);if(/^Proposta\\s+de\\s+Revis[aã]o\\s+\\d{1,3}\\s*[–—-]\\s*vig[eê]ncia\\s+ap[oó]s\\s+valida[cç][aã]o\\s+e\\s+publica[cç][aã]o\\s+institucional\\.?$/i.test(text)){changed=true;return "<w:p/>"}return p});const structural=ensureWordTableCellParagraphs(out);out=structural.xml;return {xml:out,changed:changed||structural.changed};\n}'''
          if old not in s: raise SystemExit('v0.14.15 marker function not found')
          s=s.replace(old,new,1)
          oldsan='const xml=await file.async("string"),clean=removeProposalStatusParagraphs(xml);if(!clean.changed)return {changed:false,blob};zip.file("word/document.xml",clean.xml);'
          newsan='const xml=await file.async("string"),clean=removeProposalStatusParagraphs(xml);if(!clean.changed)return {changed:false,blob};zip.file("word/document.xml",clean.xml);'
          if oldsan not in s: raise SystemExit('published sanitizer point not found')
          # Function now also repairs previously damaged table cells through removeProposalStatusParagraphs.
          s=s.replace('schema:"siash-0.14.15"','schema:"siash-0.14.16"')
          p.write_text(s)
          ip=Path('index.html'); h=ip.read_text().replace('v0.14.15','v0.14.16'); ip.write_text(h)
          PY
          node --check app.js
          node --check server.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          python3 <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(); h=Path('index.html').read_text()
          assert 'function ensureWordTableCellParagraphs' in s
          assert 'return "<w:p/>"' in s
          assert 'return ""' not in s[s.index('function removeProposalStatusParagraphs'):s.index('function updatePreparedHistoryPageCountXml')]
          assert 'schema:"siash-0.14.16"' in s and 'v0.14.16' in h
          assert 'history-table-not-found' in s and 'prepared-history-row-not-found' in s
          # Structural model: a table cell must retain at least one paragraph.
          import re
          def repair(xml):
              def cell(m):
                  tc=m.group(0)
                  if re.search(r'<w:p(?:\s|>|/)',tc): return tc
                  return re.sub(r'</w:tc>$','<w:p/></w:tc>',tc)
              return re.sub(r'<w:tc(?:\s[^>]*)?>[\s\S]*?</w:tc>',cell,xml)
          damaged='<w:tc><w:tcPr/></w:tc>'
          fixed=repair(damaged)
          assert fixed=='<w:tc><w:tcPr/><w:p/></w:tc>'
          assert '<w:p' in fixed
          print('PASS v0.14.16: marker removal preserves paragraph; damaged table cells repaired; fail-closed guards preserved')
          PY
      - name: Commit repaired implementation
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add app.js index.html
          git diff --cached --check
          git commit -m 'SIASH v0.14.16 preserve DOCX table-cell structure'
          git push origin HEAD:fix/v0.14.16-docx-xml-integrity