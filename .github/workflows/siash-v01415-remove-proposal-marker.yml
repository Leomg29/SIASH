name: SIASH v01415 remove proposal marker from vigente Word
on:
  push:
    branches:
      - fix/v0.14.15-remover-marca-proposta-vigente
    paths:
      - .github/workflows/siash-v01415-remove-proposal-marker.yml
permissions:
  contents: write
jobs:
  fix_and_test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.14.15-remover-marca-proposta-vigente
      - name: Apply safe publication cleanup and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text()
          marker='function updatePreparedHistoryPageCountXml(xml,institutionalRevision,pages){'
          pos=s.find(marker)
          if pos<0: raise SystemExit('page history function not found')
          helper='''function removeProposalStatusParagraphs(xml){\n let changed=false;const out=String(xml||"").replace(/<w:p(?:\\s[^>]*)?>[\\s\\S]*?<\\/w:p>/g,p=>{const text=xmlPlainText(p);if(/^Proposta\\s+de\\s+Revis[aã]o\\s+\\d{1,3}\\s*[–—-]\\s*vig[eê]ncia\\s+ap[oó]s\\s+valida[cç][aã]o\\s+e\\s+publica[cç][aã]o\\s+institucional\\.?$/i.test(text)){changed=true;return ""}return p});return {xml:out,changed};\n}\n'''
          if 'function removeProposalStatusParagraphs' not in s:
              s=s[:pos]+helper+s[pos:]
          old='const upd=updatePreparedHistoryPageCountXml(xml,v.preparedInstitutionalRevision,pages);if(!upd.ok)return {updated:false,reason:upd.reason};xml=upd.xml;zip.file("word/document.xml",xml);'
          new='const upd=updatePreparedHistoryPageCountXml(xml,v.preparedInstitutionalRevision,pages);if(!upd.ok)return {updated:false,reason:upd.reason};xml=upd.xml;const statusClean=removeProposalStatusParagraphs(xml);xml=statusClean.xml;zip.file("word/document.xml",xml);'
          if old not in s: raise SystemExit('finalization insertion point not found')
          s=s.replace(old,new,1)
          open_marker='async function openDocVersion(docIndex,versionIndex,kind){'
          op=s.find(open_marker)
          if op<0: raise SystemExit('openDocVersion not found')
          repair='''async function sanitizePublishedWordStatus(d,v,blob){\n if(!blob||v?.workflow!=="Vigente"||!v?.wordKey||!/\\.docx$/i.test(v?.wordName||""))return {changed:false,blob};\n try{const zip=await JSZip.loadAsync(blob),file=zip.file("word/document.xml");if(!file)return {changed:false,blob};const xml=await file.async("string"),clean=removeProposalStatusParagraphs(xml);if(!clean.changed)return {changed:false,blob};zip.file("word/document.xml",clean.xml);const fixed=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});await putDocBlob(v.wordKey,fixed);v.publishedStatusCleanedAt=nowBR();auditAdmin(`SIASH Docs: ${d.code} Word vigente saneado: removida marca textual de proposta após publicação, sem criar revisão ou alterar vigência.`);save();return {changed:true,blob:fixed}}catch(err){console.error("Falha ao sanear marca de proposta do Word vigente",err);return {changed:false,blob}}\n}\n'''
          if 'async function sanitizePublishedWordStatus' not in s:
              s=s[:op]+repair+s[op:]
          oldopen='if(key){let blob=await getDocBlob(key);if(!blob)return alert("Arquivo local não localizado neste navegador.");if(kind==="word"&&v.publicationPrepared){'
          newopen='if(key){let blob=await getDocBlob(key);if(!blob)return alert("Arquivo local não localizado neste navegador.");if(kind==="word"&&v.workflow==="Vigente"){const pubSan=await sanitizePublishedWordStatus(d,v,blob);if(pubSan.blob)blob=pubSan.blob;if(pubSan.changed)showToast("Word vigente saneado · marca de proposta removida",2200)}if(kind==="word"&&v.publicationPrepared){'
          if oldopen not in s: raise SystemExit('open Word insertion point not found')
          s=s.replace(oldopen,newopen,1)
          s=s.replace('schema:"siash-0.14.14"','schema:"siash-0.14.15"')
          p.write_text(s)
          ip=Path('index.html'); h=ip.read_text(); h=h.replace('v0.14.13','v0.14.15'); ip.write_text(h)
          PY
          node --check app.js
          node --check server.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          python3 <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(); h=Path('index.html').read_text()
          assert 'function removeProposalStatusParagraphs' in s
          assert 'sanitizePublishedWordStatus' in s
          assert 'v.workflow==="Vigente"' in s
          assert 'statusClean=removeProposalStatusParagraphs(xml)' in s
          assert 'schema:"siash-0.14.15"' in s
          assert 'v0.14.15' in h and 'Alpha Consolidada v0.14.13' not in h
          # exact-marker behavior model: marker must be narrowly scoped, not generic removal of proposal words
          assert '^Proposta\\s+de\\s+Revis' in s
          assert 'publica[cç][aã]o\\s+institucional' in s
          # fail-closed publication protections remain
          assert 'history-table-not-found' in s and 'prepared-history-row-not-found' in s
          print('PASS v0.14.15: marker cleanup, vigente repair, version and fail-closed guards')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add app.js index.html
          git diff --cached --check
          git commit -m 'SIASH v0.14.15 remove proposal marker after publication'
          git push origin HEAD:fix/v0.14.15-remover-marca-proposta-vigente
