name: SIASH v0.14.63 OOXML orphan marker root cause
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check app.js
      - run: node tests/orphan-checkmark-ooxml-rootcause.test.js
