name: SIASH v0.14.46 final-document clinical validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01446-final-document-clinical-validation]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check app.js
      - run: node tests/final-document-clinical-validation.test.js
