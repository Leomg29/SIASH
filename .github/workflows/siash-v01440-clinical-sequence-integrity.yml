name: SIASH v0.14.40 clinical sequence integrity
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01440-clinical-sequence-integrity]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check app.js
      - run: node tests/clinical-sequence-integrity.test.js
