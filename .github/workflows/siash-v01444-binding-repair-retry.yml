name: SIASH v0.14.44 scientific binding repair retry
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v01444-binding-repair-retry]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js
      - run: node --check app.js
      - run: node tests/scientific-binding-repair-retry.test.js
